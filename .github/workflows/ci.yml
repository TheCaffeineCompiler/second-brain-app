name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Conventional commits
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|build|ci|perf)(\([a-z0-9-]+\))?!?: .+'
          failed=0
          while read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "not a conventional commit: $subject"
              failed=1
            fi
          # --no-merges: pull_request checkouts synthesise a merge commit that no
          # contributor authored and that can never match the pattern.
          done < <(git log --no-merges --format=%s origin/${{ github.base_ref }}..HEAD)
          exit $failed
        shell: bash
